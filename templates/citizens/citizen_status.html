{% extends 'base.html' %}
{% block title %}Citizen Status | DCRS{% endblock %}
{% block content %}
<div class="narrow-panel glass-panel mx-auto text-center">
  <div class="kicker">Status tracker</div>
  <h2 class="section-title">{{ citizen.full_name }}</h2>
  <p class="lead text-muted">Current state: <span class="status-pill">{{ citizen.status }}</span></p>
  <p class="mb-0">Citizen ID: {{ citizen.citizen_id }}</p>
</div>
{% endblock %}
