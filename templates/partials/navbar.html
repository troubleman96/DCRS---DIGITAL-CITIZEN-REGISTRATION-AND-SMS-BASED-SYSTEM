<nav class="app-navbar">
  <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
    <button class="btn-hamburger" type="button" data-sidebar-toggle aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div style="min-width:0">
      <div class="nav-bc">District Citizen Response System</div>
      <div class="nav-title">{% block page_title %}Dashboard{% endblock %}</div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
    <button class="btn-theme" data-theme-toggle title="Toggle theme"><i class="bi bi-moon"></i></button>

    <span class="badge badge-blue d-none d-md-inline-flex">{{ user.role|default:'Guest' }}</span>

    <div class="dropdown">
      <button class="btn btn-sm btn-outline dropdown-toggle" data-bs-toggle="dropdown" type="button">
        <i class="bi bi-person-circle"></i>
        <span class="d-none d-sm-inline">{{ user.get_short_name|default:user.username }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <span class="dropdown-item" style="font-size:.75rem;opacity:.6;pointer-events:none;cursor:default">
            {{ user.email|default:user.username }}
          </span>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'accounts:logout' %}" style="margin:0">
            {% csrf_token %}
            <button type="submit" class="dropdown-item" style="background:none;border:none;width:100%;text-align:left;cursor:pointer;font-family:inherit">
              <i class="bi bi-box-arrow-right"></i> Sign out
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>
